name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Form validation (manifests, structure, Gherkin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned by SHA, decision T15)

      - name: Validate JSON manifests
        run: |
          set -e
          find . -name '*.json' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' f; do
            jq empty "$f" || { echo "::error::Invalid JSON manifest detected"; exit 1; }
          done

      - name: Check marketplace and plugin structure
        run: |
          set -e
          test -f .claude-plugin/marketplace.json || { echo "::error::Missing .claude-plugin/marketplace.json"; exit 1; }
          for p in plugins/*/; do
            test -f "${p}.claude-plugin/plugin.json" || { echo "::error::Missing plugin.json in plugin directory"; exit 1; }
            test -f "${p}README.md" || { echo "::error::Missing README.md in plugin directory"; exit 1; }
          done

      - name: Supply-chain guards (see CONTRIBUTING.md)
        run: |
          set -e
          # Hooks, MCP servers and agents are not part of the roadmap yet: their silent
          # introduction is the highest-impact attack path (auto-executed shell, arbitrary
          # binaries) against a maintainer who does not read code. Fail loudly.
          if find plugins -type d \( -name hooks -o -name agents \) | grep -q .; then
            echo "::error::hooks/ and agents/ are not allowed in plugins yet (see CONTRIBUTING.md)"; exit 1
          fi
          if find plugins -name '.mcp.json' | grep -q .; then
            echo "::error::.mcp.json is not allowed in plugins yet (see CONTRIBUTING.md)"; exit 1
          fi
          for p in plugins/*/.claude-plugin/plugin.json; do
            if jq -e 'has("hooks") or has("mcpServers") or has("agents")' "$p" >/dev/null; then
              echo "::error::hooks/mcpServers/agents fields are not allowed in plugin.json yet"; exit 1
            fi
          done
          # Marketplace sources must stay local relative paths: an external source
          # redirection would compromise every installer.
          jq -e '.plugins | all(.source | type == "string" and startswith("./"))' .claude-plugin/marketplace.json >/dev/null \
            || { echo "::error::marketplace plugin sources must be local relative paths (./...)"; exit 1; }

      - name: Check skill frontmatter
        run: |
          set -e
          find plugins -path '*/skills/*/SKILL.md' -print0 | while IFS= read -r -d '' f; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error::A SKILL.md does not start with YAML frontmatter"; exit 1; }
            sed -n '2,/^---$/p' "$f" | grep -q '^name:' || { echo "::error::A SKILL.md frontmatter lacks a name"; exit 1; }
            sed -n '2,/^---$/p' "$f" | grep -q '^description:' || { echo "::error::A SKILL.md frontmatter lacks a description"; exit 1; }
          done
          if find plugins -type d -name commands | grep -q .; then
            echo "::error::plugins must use skills/, not the legacy commands/ format"; exit 1
          fi

      - name: Lint SKILL.md against the authoring norm
        run: |
          set -e
          # Added 2026-07-31 after the four-persona cold read. Sense scored 2.87/3 and clarity
          # 2.09 — the catalogue explains itself well and executes badly, and several causes are
          # mechanical: a description with no "use when…" (nothing triggers the skill), a journey
          # step marked `= done` unconditionally (the gate bypass rule 3 forbids), a `name` that
          # drifted from its directory. Those come back the moment nobody reviews, so they are
          # checked here rather than trusted to the next review.
          # Warnings (density, internal codes, campaign dates) print without failing: they are
          # readability debt, tracked deliberately, not correctness defects.
          python eval/tools/lint_skills.py

      - name: A commit that names a decision must register it
        run: |
          set -e
          # Same defect three times in one day (2026-08-08): decisions labelled in commit messages
          # and absent from docs/DECISIONS.md. Found, filled, and explained in a commit saying
          # "commit messages are not the project's memory" — then repeated four hours later, and
          # again the same evening. A rule that survives being written down twice and still comes
          # back is not enforceable by intention.
          # Reads the HEAD commit message only: works on a shallow clone, and fires when the
          # omission happens rather than accumulating a backlog nobody reconciles.
          python eval/tools/check_decision_register.py

      - name: MCP bridge tests (the answer to "Claude Code only", never run until now)
        run: |
          set -e
          # `mcp-bridge/` est un serveur MCP opt-in ecrit pour Cursor et GitHub Copilot. Il a du
          # code, des tests, un README -- et AUCUN job ne les executait. Une revue du 2026-08-08 a
          # trouve le dossier ; trois relectures externes l'avaient manque, dont deux qui nommaient
          # l'exclusivite a Claude Code comme bloqueur numero un.
          # A l'execution : `npm test` etait casse (Node 24 refuse `node --test test/`), et le test
          # de recensement assertait `length >= 29` sous un titre disant « all 29 » alors que le
          # depot en compte 35 -- il serait passe avec six skills perdues. Les deux corriges.
          cd mcp-bridge && npm ci --no-audit --no-fund && npm test

      - name: JSON Schema of the output contract matches the validator
        run: |
          set -e
          # Le contrat existe en trois formes : la prose, ce schema, et validate_manifest.py --
          # le seul que la CI executait. Une revue du 2026-08-08 a trouve trois divergences :
          # 6 valeurs d'enum au lieu de 10, le bloc `structural` totalement absent, et un gate
          # partiel interdit alors que le validateur l'autorise. Aucun job ne comparait les deux.
          # Et en les realignant, un enum voisin a ete casse. D'ou ce controle.
          python eval/tools/check_schema_matches_validator.py

      - name: Skill counts claimed in the docs match the repository
        run: |
          set -e
          # A blank-context review panel found four different skill counts in four documents dated
          # the same day -- 30, 32, 33, 35 -- while the repository held 35. Each had been correct
          # when written. The count had already been hand-corrected four times; the fifth was the
          # point at which correcting it again stopped being the right answer.
          # docs/STATUS.md is deliberately excluded: it is a dated log, and its old numbers are
          # correct records of what was true then.
          python eval/tools/check_skill_counts.py

      - name: make check (the Makefile is verified here, not on the maintainer's machine)
        run: |
          set -e
          # `make` does not exist in the maintainer's Git Bash environment on Windows, so the
          # Makefile added on 2026-08-08 cannot be run where it was written. Shipping it unverified
          # would be exactly the habit this project spent the day removing. So the CI runs it: if a
          # target is misspelled or a recipe rots, this fails rather than the next newcomer.
          make check

      - name: Requirement sources unchanged since their test book was written
        run: |
          set -e
          # Found by measurement, not by design review: the json-server campaign (2026-08-08) ran
          # its book against the current version and got four reds, three of which were OUR fault
          # -- `_limit`, `_start`/`_end` and `arr[0]` had been removed from the documentation in
          # the meantime. The suite kept demanding retired promises with the confidence of tests
          # that had once been green. Nothing in a generated suite says when its requirement moved.
          python eval/tools/check_requirement_drift.py

      - name: automation_score self-check (mutation track)
        run: |
          set -e
          # The static track is validated by a fixture suite; the mutation track cannot be, because
          # it needs a browser and a running system under test. Both defects found on 2026-08-08
          # were in that unvalidated half and both silently inflated the kill count — a run reported
          # "n/n killed" while some assertions were never executed at all. These are the cheap
          # invariants that would have caught them.
          python eval/tools/selfcheck_automation_score.py

      - name: spec_suite_drift self-check (the specification against the suite)
        run: |
          set -e
          # Loop B of eval/sdlc-realworld-2026-08-09: contract-probe compares a running app to its
          # documentation; this compares the SUITE to that same documentation. Both halves are
          # usually self-consistent read alone, which is why nobody notices they disagree — the
          # founding case had a spec promising 409 while the suite mocked that exact case as 400.
          # Pure text, so unlike every other check here it costs nothing to run on every commit.
          # Two fixtures: one drifting where each rule must fire exactly once, one agreeing where
          # nothing may fire.
          python eval/tools/selfcheck_spec_suite_drift.py

      - name: feedback loops still name both of their ends
        run: |
          set -e
          # `feedback` and `rag-build` were both written, complete and tested long before the loop
          # between them ran: neither named the other, so nothing triggered it. Same shape as
          # mcp-bridge/ — it existed, its tests passed, and nothing executed them for weeks.
          # A loop's wiring lives in prose, in two files nobody reads together. This does not prove
          # a loop works; it proves it is still declared at both ends, which is the necessary
          # condition and the one that drifts silently during a rewrite.
          python eval/tools/check_loop_wiring.py

      - name: the oracle library against external authorities
        run: |
          set -e
          # oracle-generate exists so that expected values are DERIVED from a standard rather than
          # invented. A wrong entry in its library borrows the authority of a norm: nobody
          # re-litigates it in the generated test book. Luhn, IBAN mod-97 and the calendar are
          # computed; ISO 3166/4217 and RFC 5322 are checked against frozen external registries
          # (eval/oracles-2026-08-09/, with provenance and sha256). Six injected faults, six
          # refusals. What cannot be settled is printed as not covered rather than passed over.
          python eval/tools/check_oracle_library.py

      - name: README version claims match the plugin manifests
        run: |
          set -e
          # The README states each plugin's version twice (English and French sections). Those
          # numbers drifted behind the manifests three times in one week — always the same way:
          # a plugin is bumped as part of a fix and the prose that advertises it is not. A stale
          # version is a small lie about a project whose entire pitch is that its numbers are
          # checkable, so it is checked rather than remembered.
          python - <<'PY'
          import json, glob, io, sys
          readme = io.open('README.md', encoding='utf-8').read()
          bad = []
          for f in glob.glob('plugins/*/.claude-plugin/plugin.json'):
              d = json.load(io.open(f, encoding='utf-8'))
              claim = '`%s` %s' % (d['name'], d['version'])
              if claim not in readme:
                  bad.append('%s is at %s; README never states that version' % (d['name'], d['version']))
          for b in bad:
              print('::error::' + b)
          sys.exit(1 if bad else 0)
          PY
          echo "OK: every plugin version is stated in the README"

      - name: Skills published to external directories still match their source
        run: |
          set -e
          # Directories like qaskills.sh take a single self-contained SKILL.md, which QAIA's
          # skills deliberately are not -- their long reasoning lives in references/. Publishing
          # therefore ships a *derived* artifact, and a derived artifact with nothing watching it
          # is a copy that silently stops matching its original. Same dette as the shared output
          # contract, same answer: a job that fails when the source moves and the copy was not
          # re-read. Refresh with `python eval/tools/check_published_copies.py --update`, which
          # is the decision point rather than a formality.
          python eval/tools/check_published_copies.py

      - name: Shared output contract is identical in every plugin
        run: |
          set -e
          # Each plugin ships its own copy of docs/OUTPUT-CONTRACT.md, because a user who runs
          # `/plugin install qaia-score@qaia` receives the plugin directory and never the repo —
          # a pointer to docs/ resolved to nothing on their machine (issue #66). Four copies only
          # work if something keeps them honest, and drift between them would be silent: each
          # plugin would be validating against a different contract while claiming to share one.
          for p in plugins/*/; do
            name=$(basename "$p")
            if ! diff -q docs/OUTPUT-CONTRACT.md "$p/OUTPUT-CONTRACT.md" >/dev/null; then
              echo "::error::$name/OUTPUT-CONTRACT.md has drifted from docs/OUTPUT-CONTRACT.md."
              diff docs/OUTPUT-CONTRACT.md "$p/OUTPUT-CONTRACT.md" || true
              exit 1
            fi
          done
          echo "OK: $(ls -d plugins/*/ | wc -l) plugin copies identical to the canonical contract"

      - name: Validate skill fixtures against the shared contract
        run: |
          set -e
          # Added 2026-07-31 after the skill-eval wave found pattern P1: the example a skill
          # ships can violate the skill's own contract, so a user who follows the skill
          # *including its example* produces a non-conforming artifact. Two cases were live in
          # main: flaky-detect's manifest-after.json -- advertised in SKILL.md as "Real output
          # from fixture/, not a hypothetical" -- failed the repository's own validator with 20
          # errors, and traffic-replay's fixture had the same defect (that one the wave itself
          # had missed; this job found it).
          #
          # --batch only globs files named exactly manifest.json, which is why fixture
          # manifests (manifest-before/after.json) escaped every previous check.
          #
          # Extended to eval/ on 2026-08-01 (issue #68). The job above was written for the
          # trou it had just found -- fixture manifests under plugins/ -- and so covered the
          # instance rather than the class. Campaign manifests (eval/**/manifest*.json) were
          # covered by nothing, and four of them were failing: two validator defects (a gate
          # legitimately filled by testbook-score before aptitude-gate has run; an undeclared
          # 'dataset' artifact kind) and one data defect (a ratio written as a percentage in a
          # [0,1] field, which the scoring reads). Same lesson as D129, one level up: fixing
          # the artifacts settles the past, only a mechanism settles the future -- and the
          # mechanism has to cover the right perimeter.
          found=0
          while IFS= read -r m; do
            found=1
            python eval/tools/validate_manifest.py "$m"
          done < <(find plugins eval -name 'manifest*.json' -not -path '*/node_modules/*')
          if [ "$found" -eq 0 ]; then
            echo "No manifest under plugins/ or eval/ -- nothing to validate"
          fi

      - name: Lint Gherkin features (if any)
        run: |
          set -e
          # Excludes, beyond node_modules:
          #  - examples/*/export/ : byte-identical copies of the sibling testbooks,
          #    produced by the export skill demo (TestRail/Xray/.xlsx bundle) --
          #    intentionally duplicate Feature names, not a real defect.
          #  - eval/concerns-zone-fixtures/ : calibration fixtures (issue #21) that
          #    are deliberately near-identical across m1-m4 subfolders to exercise
          #    the CONCERNS-zone scorer -- duplication is the point of the fixture.
          #  - eval/gold-set/*/*-raw.feature : verbatim external oracle data used
          #    as ground truth for the validation campaign (D117), not authored by
          #    QAIA's own generation pipeline -- not held to the project's own
          #    Gherkin style.
          #  - eval/goldset-hardened/ : deliberately-flawed calibration fixtures
          #    (truncated.feature, fabrication.feature, c1-hollow-image.feature...)
          #    used to test the scorer's own defect-detection -- some are not even
          #    syntactically valid Gherkin by design (see corpus-24-plan.md).
          #  - eval/baselines/ : benchmark/comparison run output (D51/D58 and
          #    others), including files with a leading "> US-xxx | source: ..."
          #    citation-comment header before any Feature: line -- not valid
          #    Gherkin by construction, not a real deliverable.
          #  - eval/portability-2026-08-08/ : sorties BRUTES de quatre modeles a qui on a
          #    donne la skill telle quelle (#84). Deux d'entre elles sont invalides -- l'une
          #    en francais sans en-tete de langue, l'autre sans ligne Feature: -- et c'est
          #    tout l'interet : ce sont les defauts que la mesure a trouves. Les corriger
          #    pour faire taire le linter detruirait la preuve. Elles sont archivees comme
          #    resultat, pas comme livrable.
          FIND_ARGS=(. -name '*.feature' \
            -not -path './node_modules/*' \
            -not -path '*/export/*' \
            -not -path './eval/concerns-zone-fixtures/*' \
            -not -path './eval/gold-set/*' \
            -not -path './eval/goldset-hardened/*' \
            -not -path './eval/baselines/*'             -not -path './eval/portability-2026-08-08/*')
          if find "${FIND_ARGS[@]}" | grep -q .; then
            # -exec {} + passes each path as a single ./-prefixed argument: no word
            # splitting, no option injection. Version pinned (decision T15).
            # gherkin-lint requires an explicit config file (fails without one).
            find "${FIND_ARGS[@]}" -exec npx --yes gherkin-lint@4.2.4 -c .gherkin-lintrc {} +
          else
            echo "No .feature files yet — skipping"
          fi

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (pinned by SHA, decision T15)
        with:
          fetch-depth: 0
      - name: Verify every commit is signed off
        run: |
          set -e
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          for c in $(git log --no-merges --format='%H' "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $c is missing a Signed-off-by trailer (git commit -s)"
              bad=1
            fi
          done
          exit $bad

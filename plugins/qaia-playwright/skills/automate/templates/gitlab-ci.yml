# QAIA — Playwright CI (GitLab CI). Generated by qaia-playwright:automate (T4).
# Autonomous: no dependency on QAIA or a Claude session at runtime.
# Set BASE_URL / API_TOKEN as masked CI/CD variables (Settings → CI/CD → Variables) — never
# commit secrets (T3).
stages: [test]

e2e:
  stage: test
  # The image tag MUST match the `@playwright/test` version in your package.json. The image
  # ships pre-installed browser binaries built for one specific Playwright version; when the two
  # drift, `npm ci` installs a Playwright that cannot find the browsers baked into the image and
  # every test fails at launch with "Executable doesn't exist ... run npx playwright install".
  # The symptom names a missing browser, so it reads like an install bug rather than the version
  # mismatch it actually is — which is why it is called out here instead of left to be debugged.
  # Bump both together, or add `- npx playwright install --with-deps chromium` to before_script
  # to reinstall matching browsers at the cost of a download on every run.
  image: mcr.microsoft.com/playwright:v1.62.0-noble
  timeout: 30 minutes
  variables:
    # Overridden by masked project variables; do not hard-code real values here.
    BASE_URL: "$BASE_URL"
    API_TOKEN: "$API_TOKEN"
  before_script:
    - cd tests
    - npm ci
  script:
    # Retry/quarantine policy (T2): 0 automatic retries -- masking instability would hide the
    # exact signal a flakiness review exists to surface. A test tagged @quarantine
    # by a human after a flakiness finding is excluded from this blocking job.
    - npx playwright test --grep-invert "@quarantine"
  artifacts:
    when: always
    paths:
      - tests/playwright-report/
      - .qaia/reports/
    reports:
      junit: tests/junit.xml
    expire_in: 14 days

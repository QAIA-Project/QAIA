    --code-bg:#12151b; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);

    --bg:#0e1014; --fg:#e8eaf0; --muted:#98a0b0; --line:#242833; --card:#161a21;
    --accent:#7d94ff; --on-accent:#0e1014; --accent-soft:#1a2039;

  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:var(--on-accent)}
  .btn-ghost{border-color:var(--line);color:var(--fg);background:var(--card)}

  .chip{font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
    color:var(--muted);cursor:pointer;transition:.12s}

  .chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

  .gate.CONCERNS{background:var(--warn-soft);color:var(--warn)}
  .gate.FAIL{background:var(--bad-soft);color:var(--bad)}

  .findings li.warn{border-left-color:var(--warn);background:var(--warn-soft)}

  .src-tag.auth{color:var(--ok)}

  pre{background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto;

  footer{border-top:1px solid var(--line);margin-top:48px;padding:26px 0;color:var(--muted);font-size:14px}
  .cta-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}

  Then le montant inclut la majoration MCS`}
};

const ORDER = ["good","hollow","noexpected","fabrication","redundant"];
let LANG = "en";
try{ const s=localStorage.getItem("qaia_lang"); if(s==="fr"||s==="en") LANG=s;
     else if((navigator.language||"").toLowerCase().startsWith("fr")) LANG="fr"; }catch(e){}

const chipsEl=document.getElementById("chips"), bookEl=document.getElementById("book"), verdictEl=document.getElementById("verdict");
let current=null, dirty=false, lastPreview=null;

function applyLang(){
  const t=T[LANG];
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i]").forEach(el=>{ const k=el.getAttribute("data-i"); if(t[k]!=null){ if(k==="emptyPrompt") el.innerHTML=t[k]; else el.textContent=t[k]; } });
  document.getElementById("installPre").textContent=t.install;
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  // chips
  [...chipsEl.children].forEach(c=>{ c.firstChild.nodeValue=EX[c.dataset.k].label[LANG]; });
  // re-render current verdict in the new language
  if(current && !dirty) render(EX[current], true);
  else if(lastPreview) render(lastPreview, false);
  else verdictEl.innerHTML='<p style="color:var(--muted);margin:auto;text-align:center">'+t.emptyPrompt+'</p>';
}
function setLang(l){ LANG=l; try{localStorage.setItem("qaia_lang",l);}catch(e){} applyLang(); }
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

ORDER.forEach(k=>{ const b=document.createElement("button"); b.className="chip"; b.dataset.k=k;
  b.appendChild(document.createTextNode(EX[k].label[LANG])); b.onclick=()=>load(k); chipsEl.appendChild(b); });

function load(k){ current=k; dirty=false; lastPreview=null; bookEl.value=EX[k].book;
  [...chipsEl.children].forEach(c=>c.classList.toggle("on",c.dataset.k===k)); render(EX[k], true); }
bookEl.addEventListener("input",()=>{ dirty=true; [...chipsEl.children].forEach(c=>c.classList.remove("on")); });
document.getElementById("clear").onclick=()=>{ current=null;dirty=true;lastPreview=null;bookEl.value="";
  [...chipsEl.children].forEach(c=>c.classList.remove("on"));
  verdictEl.innerHTML='<p style="color:var(--muted);margin:auto;text-align:center">'+T[LANG].emptyPrompt+'</p>'; };
document.getElementById("judge").onclick=()=>{
  if(current && !dirty){ render(EX[current], true); return; }
  lastPreview=preview(bookEl.value); render(lastPreview, false); };

function preview(text){
  const scen=splitScenarios(text), F=[]; let stop=false;
  if(!scen.length) return {score:null,gate:"CONCERNS",auth:false,reasonKey:"pv_none",findings:[{k:"warn",tk:"pv_nothing"}]};
  scen.forEach(s=>{
    const then=s.then.join(" ").toLowerCase(), gw=(s.given.concat(s.when)).join(" ");
    if(/\[\s*(à|a)\s*d[eé]finir|todo|fixme|<\s*placeholder\s*>|\bxxx\b|\btbd\b/i.test(s.raw)) F.push({k:"warn",lit:(LANG==="fr"?`‘${s.name}’ — marqueur non résolu.`:`‘${s.name}’ — unresolved placeholder.`)});
    if(!s.then.length){ F.push({k:"bad",lit:(LANG==="fr"?`‘${s.name}’ — aucun Then : pas un test. (C2)`:`‘${s.name}’ — no Then at all: not a test. (C2)`)}); stop=true; return; }
    if(/\b(voir|see|cf\.?|selon|according to)\b.*(image|tableau|table|screenshot|capture|annexe|maquette)/i.test(then)){ F.push({k:"bad",lit:(LANG==="fr"?`‘${s.name}’ — le Then renvoie à une image/un tableau : couverture creuse. (C1)`:`‘${s.name}’ — Then defers to an image/table: hollow coverage. (C1)`)}); stop=true; }
    else if(!/\d|"[^"]+"|status|http|=|égal|equal|contient|contains|affiche|displays|rejet|reject|\b(est|is)\b/i.test(then) && /correct|comme attendu|as expected|works?|fonctionne|properly|sans erreur|ok\b/i.test(then)){ F.push({k:"bad",lit:(LANG==="fr"?`‘${s.name}’ — le Then n’affirme rien de vérifiable. (C2)`:`‘${s.name}’ — Then asserts nothing verifiable. (C2)`)}); stop=true; }
    if(/(…|\.\.\.|\bet|\bla)\s*$/i.test(gw) || s.when.some(w=>w.split(/\s+/).length<2)) F.push({k:"warn",lit:(LANG==="fr"?`‘${s.name}’ — un pas semble tronqué.`:`‘${s.name}’ — a step looks truncated.`)});
    if(!s.tags.some(t=>/@QAIA-|@[A-Z]{2,}-?\d/.test(t))) F.push({k:"warn",lit:(LANG==="fr"?`‘${s.name}’ — pas d’@ID stable : non traçable.`:`‘${s.name}’ — no stable @ID: not traceable.`)});
  });
  const bad=F.some(f=>f.k==="bad");
  return {score:null, gate:bad?"FAIL":(F.length?"CONCERNS":"PASS"), auth:false,
    reasonKey: bad?"pv_bad":(F.length?"pv_warn":"pv_ok"),
    findings: F.length?F:[{k:"ok",tk:"pv_noclean"}]};
}
function splitScenarios(text){
  const out=[]; let cur=null,inThen=false,tags=[];
  text.split("\n").forEach(raw=>{ const l=raw.trim();
    if(l.startsWith("@")){ tags=tags.concat(l.split(/\s+/)); return; }
    let m=l.match(/^(Scenario Outline|Scenario Template|Scenario|Scénario|Example|Exemple)\s*:\s*(.*)/i);
    if(m){ if(cur)out.push(cur); cur={name:m[2]||"(unnamed)",raw:"",given:[],when:[],then:[],tags}; tags=[]; inThen=false; return; }
    if(!cur) return; cur.raw+=" "+l;
    let s=l.match(/^(Given|When|Then|And|But|Soit|Quand|Alors|Et|Mais)\b(.*)/i);
    if(s){ const k=s[1].toLowerCase(), t=(s[2]||"").trim();
      if(k==="then"||k==="alors"){inThen=true;cur.then.push(t);}
      else if(k==="given"||k==="soit"){inThen=false;cur.given.push(t);}
      else if(k==="when"||k==="quand"){inThen=false;cur.when.push(t);}
      else { (inThen?cur.then:cur.when).push(t); } }
  });
  if(cur)out.push(cur); return out;
}

function fText(f){ return f.t ? f.t[LANG] : (f.tk ? T[LANG][f.tk] : f.lit); }
function render(v, auth){
  const t=T[LANG];
  const scoreHtml = v.score==null ? '<div class="score" style="color:var(--muted)">–<small>/100</small></div>'
    : '<div class="score" id="sc">0<small>/100</small></div>';
  const gateTxt = v.signal ? "PASS ·signal" : v.gate;
  const reasonTxt = v.reason ? v.reason[LANG] : T[LANG][v.reasonKey];
  verdictEl.innerHTML = `
    <div class="score-row">${scoreHtml}<span class="gate ${v.gate}">${gateTxt}</span></div>
    <p class="reason">${reasonTxt}</p>
    <ul class="findings">${v.findings.map(f=>`<li class="${f.k||'bad'}">${fText(f)}</li>`).join("")}</ul>
    ${auth?`<div class="two-nums">
      <div class="num"><div class="k">${t.k1}</div><div class="v">${t.v1}</div></div>
      <div class="num"><div class="k">${t.k2}</div><div class="v">${t.v2}</div></div></div>`:""}
    <div class="src-tag ${auth?'auth':''}">${auth? t.authTag : t.previewTag}</div>`;
  if(v.score!=null){ animate(document.getElementById("sc"), v.score); }
}
function animate(el,target){ let n=0; const step=Math.max(1,Math.round(target/28));
  const id=setInterval(()=>{ n+=step; if(n>=target){n=target;clearInterval(id);} el.firstChild.nodeValue=n; },16); }

applyLang();
load("hollow");
</script>
</body>
</html>
